---
# Worker Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      nodeSelector:
        role: benchmark-node
      containers:
      - name: worker
        image: protocol-harness:v1.0
        imagePullPolicy: Never
        env:
        - name: SERVICE_ROLE
          value: "worker"
        - name: PROTOCOL
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - containerPort: 8080
        - containerPort: 50051
        - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: worker-service
spec:
  selector:
    app: worker-service
  ports:
  - name: http
    port: 8080
  - name: grpc
    port: 50051
  - name: thrift
    port: 9090
---
# Gateway Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      nodeSelector:
        role: benchmark-node
      containers:
      - name: gateway
        image: protocol-harness:v1.0
        imagePullPolicy: Never
        env:
        - name: SERVICE_ROLE
          value: "gateway"
        - name: WORKER_HOST
          value: "worker-service"
        - name: PROTOCOL
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: gateway-service
  ports:
  - name: http
    port: 80
---
# Locust Load Generator Pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgenerator
  template:
    metadata:
      labels:
        app: loadgenerator
    spec:
      nodeSelector:
        role: loadgen-node
      containers:
      - name: main
        image: locustio/locust
        command: ["/bin/sh", "-c", "sleep infinity"]
