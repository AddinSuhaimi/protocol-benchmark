syntax = "proto3";
package order;
option go_package = "./pb";

message OrderItem {
  string item_id = 1;
  int32 quantity = 2;
  double price = 3;
}

message OrderPayload {
  string order_id = 1;
  string user_id = 2;
  repeated OrderItem items = 3;
  double total_amount = 4;
}

message OrderResponse {
  string status = 1;
}

service OrderService {
  rpc ProcessOrder (OrderPayload) returns (OrderResponse);
}
